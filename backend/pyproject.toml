[project]
name = "spend-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic[bedrock]>=2.10.0",
    "fastapi>=0.164.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
